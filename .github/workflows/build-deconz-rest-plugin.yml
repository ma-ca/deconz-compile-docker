name: Build deconz-rest-plugin

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Run docker push to ghcr.io'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  build-compile:
    strategy:
      matrix:
        release:
          # - buster
          # - bullseye
          # - bookworm
          - trixie
        cpu:
          - arm32v6
          - arm32v7
          - arm64v8
          - no_qemu
        qtversion:
          - 5
          - 6
        # include:
        #   # - release: bookworm
        #   #   qtversion: 6
        #   - release: trixie
        #     cpu: no_qemu
        #     qtversion: 6
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Run build-compile begin ${{ matrix.release }}
      run: |
        echo "release = ${{ matrix.release }}"
    - name: Run build-compile begin ${{ matrix.cpu }}
      run: |
        echo "cpu = ${{ matrix.cpu }}"
    - name: Run qtversion = ${{ matrix.qtversion }}
      run: |
        echo "qtversion = ${{ matrix.qtversion }}"

    - name: Checkout dresden-elektronik/deconz-rest-plugin
      uses: actions/checkout@v7
      with:
        repository: dresden-elektronik/deconz-rest-plugin
        path: deconz-rest-plugin
        fetch-depth: 0

    - name: Check release
      id: check
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd deconz-rest-plugin
        gitcommit=$(git rev-parse --short HEAD)
        VERSION="$(git describe --tags $(git rev-list --tags --max-count=1) )"
        echo "version=$VERSION" >> ${GITHUB_ENV}
        cd ..
        echo "check release = $VERSION"
        # update_release=false
        # gh release view $VERSION || update_release=true
        # gh release list
        # echo "update_release=${update_release}" >> ${GITHUB_ENV}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set image_name
      run: |
        CPU=${{ matrix.cpu }}
        qtversion=${{ matrix.qtversion }}
        QT=""
        if [ "$qtversion" = "6" ]; then
          QT="qt6-"
        fi
        release=${{ matrix.release }}
        
        echo "release=${release}" >> ${GITHUB_ENV}
        echo "qtversion=${qtversion}" >> ${GITHUB_ENV}
        echo "cpu=${CPU}" >> ${GITHUB_ENV}
        if [ "x$CPU" = "xno_qemu" ]; then
          package="deconz-dev-${QT}${release}"
        else
          package="deconz-dev-${QT}${release}-${CPU}"
        fi
        image_name=ghcr.io/${{ github.repository_owner }}/${package}
        echo "image_name=${image_name}" >> ${GITHUB_ENV}
        echo "package=${package}" >> ${GITHUB_ENV}

    - name: Build docker image from ${{ matrix.release }}
      run: |
        CPU=${{ matrix.cpu }}
        repository="http://raspbian.raspberrypi.com/raspbian/"
        arch=armhf
        qemu=""
        TARGET_CPU=""
        if [ "x$CPU" = "xarm32v6" ]; then
          qemu="ENV QEMU_CPU=arm1176"
          TARGET_CPU="arm1176"
        fi
        if [ "x$CPU" = "xarm64v8" ]; then
          arch="arm64"
          repository="http://deb.debian.org/debian"
        fi
        echo "qemu_cpu=$TARGET_CPU" | tee -a ${GITHUB_ENV}
        echo "arch=$arch" | tee -a ${GITHUB_ENV}
        release=${{ env.release }}
        qtversion=${{ matrix.qtversion }}
        armfile=${TARGET_CPU:-arm}
        echo "armfile=${TARGET_CPU:-arm}" | tee -a ${GITHUB_ENV}
        if [ "$release" = "buster" ]; then
          repository="http://archive.debian.org/debian-archive/debian"
        fi
        legacy=""
        if [ "$release" = "buster" -o "$release" = "bullseye" ]; then
          legacy="legacy"
        fi
        echo "repository=$repository" | tee -a ${GITHUB_ENV}
        echo "legacy=$legacy" | tee -a ${GITHUB_ENV}
        dockerfile=Dockerfile-deconz-dev-qt${qtversion}-${armfile}
        if [ "x$CPU" = "xno_qemu" ]; then
          dockerfile=Dockerfile-deconz-dev-qt${qtversion}${legacy}
        fi
        echo "dockerfile=$dockerfile" | tee -a ${GITHUB_ENV}

    - name: Show image_name ${{ env.image_name }}
      run: echo "${{ env.image_name }} "

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push image from ${{ matrix.release }}
      uses: docker/build-push-action@v7
      with:
        file: ${{ env.dockerfile }}
        push: ${{ github.event.inputs.push_image == 'true' }}
        platforms: linux/amd64,linux/arm64
        tags: |
          ${{ env.image_name }}:latest
          ${{ env.image_name }}:${{ env.version }}
        build-args: |
          RELEASE=${{ env.release }}
          TARGET_ARCH=${{ env.arch }}
          TARGET_CPU=${{ env.qemu_cpu }}
          REPOSITORY=${{ env.repository }}

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      if: ${{ env.legacy == '' && env.cpu == 'arm64v8' }}
      continue-on-error: true
      with:
        image-ref: ${{ env.image_name }}:${{ env.version }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        ignore-unfixed: true

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: ${{ env.legacy == '' && env.cpu == 'arm64v8' }}
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Show docker image ${{ env.image_name }} cpu uname -m
      if: ${{ github.event.inputs.push_image == 'true' }}
      run: docker run --rm ${{ env.image_name }} uname -m | xargs -i echo "uname={}" >> ${GITHUB_ENV}

    - name: Show uname -m = ${{ env.uname }}
      run: echo "uname -m = ${{ env.uname }}"

